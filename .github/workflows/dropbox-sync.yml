name: Dropbox sync

on:
  workflow_dispatch:        # manual "Run sync" button
  schedule:
    - cron: "23 * * * *"    # hourly (acts as a backstop even with a webhook)

permissions:
  contents: write

concurrency:
  group: dropbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A stuck step must never hold the concurrency group for hours again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install thumbnail tools (ffmpeg + poppler + ImageMagick)
        # OPTIONAL — every use of these binaries in scripts/dropbox-sync.mjs is
        # wrapped in try/catch and degrades via warnOnce(), and raster thumbnails
        # come from Dropbox's own API, not from here. Without them the sync still
        # completes; only video/PDF/vector thumbs are skipped, and a later run
        # backfills them. So this step must NEVER fail the job — on 2026-08-19 a
        # stalled apt mirror did exactly that and the Sync step was skipped
        # entirely, publishing nothing.
        continue-on-error: true
        # Hung indefinitely twice on 2026-08-18 (one run sat here 3+ hours and
        # blocked every later sync behind the concurrency group). Causes and
        # guards, in order:
        #  - no DEBIAN_FRONTEND: apt can block forever on an interactive prompt
        #  - no timeout: a stalled mirror never returns, and Actions will happily
        #    wait out the full 6-hour job limit
        #  - ubuntu-latest already ships ffmpeg and imagemagick, so most of this
        #    work was unnecessary anyway — only install what is actually missing
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          need=""
          command -v ffmpeg      >/dev/null || need="$need ffmpeg"
          command -v pdftoppm    >/dev/null || need="$need poppler-utils"
          command -v convert     >/dev/null || need="$need imagemagick"
          command -v gs          >/dev/null || need="$need ghostscript"
          command -v rsvg-convert>/dev/null || need="$need librsvg2-bin"
          if [ -z "$need" ]; then
            echo "All thumbnail tools already present — skipping apt."
          else
            echo "Installing:$need"
            # Fast path: the runner image already carries a package index, and it
            # is `apt-get update` that has been stalling — so try the install on
            # its own first and only refresh the index if that fails.
            if timeout 240 sudo -E apt-get install -y -qq --no-install-recommends $need; then
              echo "installed without an index refresh"
              need=""
            fi
            for attempt in 1 2 3; do
              [ -z "$need" ] && break
              if timeout 150 sudo -E apt-get update -qq \
                 && timeout 240 sudo -E apt-get install -y -qq --no-install-recommends $need; then
                echo "apt succeeded on attempt $attempt"; break
              fi
              echo "apt attempt $attempt failed or timed out; retrying"
              sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend || true
              [ "$attempt" = 3 ] && { echo "::warning::apt failed 3 times — continuing without these tools; video/PDF/vector thumbnails will be skipped this run"; exit 0; }
              sleep 15
            done
          fi
          # Ubuntu ships ImageMagick with PDF/AI/EPS reading disabled by policy;
          # re-enable read so white AI/PDF logos can be composited onto gray.
          sudo sed -i -E 's/rights="none" pattern="(PDF|EPS|PS|AI)"/rights="read|write" pattern="\1"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Sync from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/dropbox-sync.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "dropbox-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Bump the synced.js cache token so GitHub Pages serves the fresh file.
          node -e "const fs=require('fs');let h=fs.readFileSync('index.html','utf8');h=h.replace(/synced\.js\?v=[0-9a-z]+/,'synced.js?v='+Date.now());fs.writeFileSync('index.html',h)"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes from Dropbox."
          else
            git commit -m "Dropbox sync: refresh assets [skip ci]"
            # Rebase onto any commits that landed while we were syncing (manual
            # pushes or an overlapping run) and retry, so the push can't lose a
            # race and fail the job.
            for i in 1 2 3 4 5; do
              if git push; then echo "pushed"; break; fi
              echo "push rejected (attempt $i) — rebasing and retrying"
              git pull --rebase --autostash origin main || true
              sleep 5
            done
          fi
