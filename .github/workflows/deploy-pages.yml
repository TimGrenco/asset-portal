name: Deploy to Pages

# Replaces GitHub's legacy branch-based Pages build. Having our own workflow lets
# us control concurrency: overlapping deploys (rapid pushes + the hourly Dropbox
# sync) cancel the older run cleanly instead of piling up and emailing a failure
# on every timeout/supersede.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Publish after the Dropbox sync commits fresh assets (its commit carries
  # [skip ci], so it won't trigger the push event above — this does it instead).
  workflow_run:
    workflows: ["Dropbox sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the static site — index.html + assets/** + .nojekyll —
      # not scripts/, .github/, or any local-only helpers.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          [ -f .nojekyll ] && cp .nojekyll _site/.nojekyll || touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
