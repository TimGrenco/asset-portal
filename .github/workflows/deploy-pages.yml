name: Deploy to Pages

# Replaces GitHub's legacy branch-based Pages build. Owning the workflow lets us
# (a) control concurrency and (b) auto-retry GitHub Pages' intermittent
# "Deployment failed, try again later" API error so a transient hiccup self-heals
# instead of emailing a failure. The content always ends up published either way;
# this just stops the noise.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - "CNAME"
      - "robots.txt"
      - "sitemap.xml"
      - "404.html"
      - "apple-touch-icon.png"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Publish after the Dropbox sync commits fresh assets (its commit carries
  # [skip ci], so it won't trigger the push event above — this does it instead).
  workflow_run:
    workflows: ["Dropbox sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the dedupe step below delete duplicate artifacts

# Don't cancel an in-progress deploy (GitHub's recommended setting) — cancelling
# mid-deploy can itself fail. Overlapping runs queue; intermediate queued runs are
# skipped, only the latest deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the static site — index.html + assets/** + .nojekyll + CNAME —
      # not scripts/, .github/, or any local-only helpers. CNAME must be published
      # or GitHub Pages drops the custom domain (assets.gpen.com) on every deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          [ -f .nojekyll ] && cp .nojekyll _site/.nojekyll || touch _site/.nojekyll
          [ -f CNAME ] && cp CNAME _site/CNAME || true
          for f in robots.txt sitemap.xml 404.html apple-touch-icon.png; do [ -f "$f" ] && cp "$f" _site/; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub's artifact backend intermittently registers a single upload more
      # than once, leaving 2-3 artifacts all named "github-pages" on the run.
      # actions/deploy-pages then aborts with "Multiple artifacts named
      # github-pages were unexpectedly found" and every retry below hits the same
      # duplicates, so the run fails and emails. Keep only the newest github-pages
      # artifact so the deploy sees exactly one.
      - name: Dedupe Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name=="github-pages")] | sort_by(.created_at) | reverse | .[1:] | .[].id')
          if [ -n "$ids" ]; then
            echo "Duplicate github-pages artifacts found; deleting all but the newest:"
            for id in $ids; do
              echo "  deleting artifact $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
            done
          else
            echo "Exactly one github-pages artifact — nothing to dedupe."
          fi

      # Deploy, with a retry for TRANSIENT failures only.
      #
      # Two distinct failure modes, and they need opposite handling:
      #  1. Fast failure — Pages returns "Deployment failed, try again later"
      #     within seconds. Retrying fixes it. This is what the retry is for.
      #  2. Timeout — the site is large (~185MB of synced thumbnails), so Pages
      #     can take longer than deploy-pages' 600s default to finish processing.
      #     The deployment is still PENDING server-side; creating another one
      #     cancels it, which is exactly what broke deploys on 2026-08-06 (three
      #     attempts, "Deployment cancelled", 11m35s, nothing published).
      #
      # So: give attempt 1 a generous 30-minute window, and only retry if it
      # failed FAST. A slow failure means "still working" — leave it alone.
      - id: t1
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - id: gate
        run: |
          dur=$(( $(date +%s) - ${{ steps.t1.outputs.start }} ))
          echo "attempt 1 outcome=${{ steps.deploy1.outcome }} after ${dur}s"
          if [ "${{ steps.deploy1.outcome }}" = "failure" ] && [ "$dur" -lt 120 ]; then
            echo "fast failure — safe to retry"; echo "retry=yes" >> "$GITHUB_OUTPUT"
          else
            echo "not retrying (success, or a slow failure whose deployment may still be pending)"
            echo "retry=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.retry == 'yes'
        run: sleep 30
      - id: deployment
        if: steps.gate.outputs.retry == 'yes'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      # Surface a slow failure rather than passing silently.
      - if: steps.gate.outputs.retry == 'no' && steps.deploy1.outcome == 'failure'
        run: |
          echo "::error::Pages deployment did not complete within 30 minutes."
          echo "The site is ~185MB; consider shrinking assets/synced thumbnails."
          exit 1
